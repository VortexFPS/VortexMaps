# Compile the classic map set and publish it as per-role release assets.
#
# One job per map, deliberately. GitHub-hosted runners cap a JOB at 6 hours, and -vis/-light on a large
# map is the expensive part, so a single job compiling 31 maps would risk the wall while a matrix gives
# each map its own budget and runs them concurrently. Minutes are unmetered on public repos.
#
# .vmap maps are NOT built here. Their lighting is pre-baked by the game's own baker, with no q3map2
# step at all - see the restructure plan section 9.2.
name: build-maps

on:
  push:
    tags: ['maps-*']
  workflow_dispatch:
    inputs:
      maps:
        description: 'Space-separated map names to build (default: all)'
        required: false
        default: ''
      publish:
        description: 'Publish a release even on a manual run'
        type: boolean
        default: false

# Least privilege: read-only for every job, and write granted to the one job that publishes.
#
# This is the shape GitHub's own security-hardening guidance asks for, and it is why the org's
# read-only default GITHUB_TOKEN setting is correct and should stay that way. That setting controls what
# a workflow gets when it says nothing; a workflow that declares `permissions` gets what it declares.
# So the compile and compression jobs — which pull a third-party toolchain and run it over content —
# hold a token that cannot write to the repository at all.
permissions:
  contents: read

env:
  NETRADIANT_REF: master
  # ONE list, used by BOTH the job that builds q3map2 and the jobs that RUN it. They are separate
  # runners, and the build job only downloads the binary as an artifact - so without installing the same
  # libraries q3map2 dynamically links against, it dies at exec time with
  # "error while loading shared libraries: libminizip.so.1". Keeping the list in one place is the point:
  # the two jobs drifting apart is exactly how that happened.
  Q3MAP2_DEPS: >-
    libglib2.0-dev libjpeg-dev libpng-dev libwebp-dev libxml2-dev libminizip-dev
    libx11-dev libgl1-mesa-dev
  # The game repo supplies the small part of the content a map references that does not live in
  # sources/ - see build/map-compiler-config.pl. Both repos are public, so actions/checkout clones it
  # anonymously; no cross-repo token or secret is involved.
  ARENA_REPO: VortexFPS/VortexArena
  ARENA_REF: main

jobs:
  # ── Build q3map2 once and share it, rather than in each of 31 matrix jobs ──────────────────
  compiler:
    runs-on: ubuntu-latest
    steps:
      - name: Cache the built compiler
        id: cache
        uses: actions/cache@v4
        with:
          path: q3map2-bin
          key: q3map2-${{ env.NETRADIANT_REF }}-${{ runner.os }}

      # All headless: GTK3 is optional and belongs to the Radiant GUI, X11 is only a -dev package at
      # configure time, and libpng is what makes q3map2 read our PNG sources.
      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          # libgl1-mesa-dev is needed even with BUILD_RADIANT=OFF: BUILD_TOOLS builds every tool in the
          # tree, and tools/heretic2/CMakeLists.txt does a REQUIRED find_package(OpenGL) at configure
          # time. Found by the second CI run, after BUILD_RADIANT=OFF cleared the GTK failure.
          sudo apt-get install -y --no-install-recommends build-essential cmake git $Q3MAP2_DEPS

      - name: Build q3map2
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$NETRADIANT_REF" https://gitlab.com/xonotic/netradiant.git
          # BUILD_RADIANT=OFF is required, not an optimisation: netradiant's configure step pulls GTK in
          # as a hard requirement for the GUI (cmake/FindGTK2.cmake via pkg_check_modules), so a plain
          # configure fails with "Package 'gtk+-3.0' ... not found" before it ever reaches the q3map2
          # target. DOWNLOAD_GAMEPACKS=OFF skips a network fetch we have no use for.
          cmake -S netradiant -B netradiant/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_RADIANT=OFF \
            -DBUILD_TOOLS=ON \
            -DDOWNLOAD_GAMEPACKS=OFF
          cmake --build netradiant/build --target q3map2 -j"$(nproc)"
          mkdir -p q3map2-bin
          cp "$(find netradiant/build -name q3map2 -type f -perm -u+x | head -1)" q3map2-bin/q3map2

      - name: Confirm it runs and reports PNG support
        run: |
          chmod +x q3map2-bin/q3map2
          q3map2-bin/q3map2 -help 2>&1 | head -5 || true

      - uses: actions/upload-artifact@v4
        with:
          name: q3map2
          path: q3map2-bin/q3map2
          retention-days: 1

  # ── The art half. q3map2 makes geometry; this makes the textures that dress it ─────────────
  #
  # One job, not per-map: textures are overwhelmingly shared, so compressing them once and splitting
  # afterwards is both correct and far cheaper than 31 jobs each redoing the shared sets.
  textures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libnvtt-bin gives nvcompress. ImageMagick is NOT optional: the converter picks the DXT format
      # per texture by measuring PSNR, which needs `compare`.
      - name: Install the compressor and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnvtt-bin imagemagick
          nvcompress --help 2>&1 | head -2 || true

      # Content-addressed, so editing one texture recompresses one texture. Keyed on the source tree so
      # a texture change invalidates it and a .map change does not.
      - name: Cache the compression results
        uses: actions/cache@v4
        with:
          path: ~/.xonotic-cached-converter
          key: dds-${{ runner.os }}-${{ hashFiles('sources/textures/**', 'sources/models/**') }}
          restore-keys: dds-${{ runner.os }}-

      - name: Compress textures to DDS
        env:
          DDS_TOOL: nvcompress
        run: bash build/compress-textures.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dds
          path: builds/dds/
          retention-days: 1
          if-no-files-found: error

  # ── Data-driven matrix, so adding a map needs no workflow edit ─────────────────────────────
  discover:
    runs-on: ubuntu-latest
    outputs:
      maps: ${{ steps.list.outputs.maps }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          if [ -n "${{ inputs.maps }}" ]; then
            names="${{ inputs.maps }}"
          else
            names=$(cd sources/maps && ls *.map 2>/dev/null | sed 's/\.map$//' | tr '\n' ' ')
          fi
          printf '%s' "$names" | tr ' ' '\n' | grep . | jq -R . | jq -cs . > maps.json
          echo "maps=$(cat maps.json)" >> "$GITHUB_OUTPUT"
          echo "building $(jq length maps.json) map(s): $names"

  build:
    needs: [compiler, discover]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one hard map must not cancel the other thirty
      max-parallel: 10 # be a good neighbour on the shared runner pool
      matrix:
        map: ${{ fromJson(needs.discover.outputs.maps) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: maps

      # Only the slice of the game's content a map compile actually reaches for. Sparse and blobless:
      # data/ is ~900 MB in full, and this takes the core pack only. Cached so 31 jobs do not each
      # re-clone it.
      - name: Cache the game content slice
        id: arena-cache
        uses: actions/cache@v4
        with:
          path: arena
          key: arena-core-${{ env.ARENA_REF }}-${{ hashFiles('maps/build/map-compiler-config.pl') }}

      - name: Check out the game content slice
        if: steps.arena-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARENA_REPO }}
          ref: ${{ env.ARENA_REF }}
          path: arena
          sparse-checkout: data/core.pk3dir
          sparse-checkout-cone-mode: true
          filter: blob:none

      - uses: actions/download-artifact@v4
        with:
          name: q3map2
          path: bin

      # q3map2 is dynamically linked, and this is a DIFFERENT runner from the one that built it.
      - name: Install the q3map2 runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $Q3MAP2_DEPS

      # Fail here with a readable reason rather than partway into a compile. `ldd -r` reports any missing
      # object or unresolved symbol; without this the symptom was a bare exit 2 from the Perl wrapper and
      # the real message ("libminizip.so.1: cannot open shared object file") was buried in its output.
      - name: Check q3map2 can load
        run: |
          chmod +x bin/q3map2
          if ldd -r bin/q3map2 2>&1 | grep -E 'not found|undefined symbol'; then
            echo "::error::q3map2 has unsatisfied runtime dependencies - Q3MAP2_DEPS is incomplete"
            exit 1
          fi
          echo "q3map2 loads cleanly"

      # compile-map.sh converts q3map2's external lightmap pages from TGA to PNG, which needs Pillow —
      # not preinstalled on ubuntu-latest. Missing it fails the compile closed on ImportError rather than
      # quietly shipping TGA pages, so this step is about not breaking the build, not about correctness.
      - name: Install Pillow (lightmap page conversion)
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Compile ${{ matrix.map }}
        working-directory: maps
        env:
          VORTEXARENA_ROOT: ${{ github.workspace }}/arena
          VORTEXMAPS_Q3MAP2: ${{ github.workspace }}/bin/q3map2
        run: |
          chmod +x build/vendor/xonotic-map-compiler
          cp build/map-compiler-config.pl "$HOME/.xonotic-map-compiler"
          bash build/compile-map.sh "${{ matrix.map }}"

      - uses: actions/upload-artifact@v4
        with:
          name: map-${{ matrix.map }}
          path: maps/builds/q3map2/${{ matrix.map }}/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [build, textures]
    if: startsWith(github.ref, 'refs/tags/maps-') || inputs.publish
    runs-on: ubuntu-latest
    # Creating a release and uploading assets is a `contents` write: GitHub has no separate `releases`
    # scope, so this is the narrowest grant that can publish. It is coarser than we would like — the same
    # token could push commits or move tags — which is the reason it is confined to this one job, and the
    # reason the tag-protection ruleset (restructure G12) matters: it stops a compromised or buggy run
    # from deleting or retargeting a map tag that released game builds already pin.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: map-*
          path: builds/q3map2
      - uses: actions/download-artifact@v4
        with:
          name: dds
          path: builds/dds

      # Three inputs, because a shippable archive needs all three: geometry from q3map2, textures from
      # the compression pass, and the art that is neither compiled nor compressed (shader scripts,
      # skybox JPEGs, sounds, model meshes) copied from sources. Missing the third would ship a map with
      # textures and no materials to apply them with.
      #
      # Packages per-role (one shared archive plus one per map) and carries the per-item licence notices
      # out of sources/ into whichever archive holds the art they cover — a correctness requirement, not
      # a nicety. See build/packlib.py.
      - name: Package and emit the manifest
        run: |
          version="${GITHUB_REF_NAME#maps-}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="$(date -u +%Y.%m)-manual"
          python3 build/publish.py builds/q3map2 \
            --dds builds/dds \
            --art-from sources \
            --out dist --version "$version" --sources sources \
            --expect-packs 31

      - name: Check the release-asset limit
        run: |
          if find dist -type f -size +2000M | grep -q .; then
            echo "::error::an archive exceeds the 2 GiB per-asset limit"; exit 1
          fi
          ls -la dist

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/maps-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Map set $GITHUB_REF_NAME" --generate-notes
          # .pk3, not .zip: a pk3 IS a zip, and the game mounts one natively, so fetch-maps.py installs
          # these as-is rather than extracting them. See build/README.md.
          gh release upload "$GITHUB_REF_NAME" dist/*.pk3 --clobber
          # The manifest is what VortexArena's tools/data/update-maps-lock.py re-pins the lockfile from.
          # Attaching it to the RELEASE (not just as a CI artifact) means that step needs nothing but the
          # tag — no digging through a workflow run page to download an artifact by hand.
          gh release upload "$GITHUB_REF_NAME" dist/manifest.json --clobber

      # data/maps.lock.json in the game repo is generated from this.
      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: dist/manifest.json
